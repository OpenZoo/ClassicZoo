name: Build CI-specific versions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build_windows:
    runs-on: ubuntu-22.04
    env:
      FPC_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Update Ubuntu packages
        run: sudo apt-get update
      - name: Set up Ubuntu packages
        run: sudo apt-get install -y fp-compiler-3.2.2 fp-units-base-3.2.2 fp-units-fcl-3.2.2 fp-units-net-3.2.2 fp-units-rtl-3.2.2 fp-utils-3.2.2 git zip libsdl2-dev
      - name: Install Win64 FPC units
        run: sudo sh -c "cd /usr/lib/x86_64-linux-gnu/ && curl https://asie.pl/files/fpc-3.2.2-units-win64.tar.gz | tar xzvf -"
      - name: Download Win64 syslibs
        run: sudo sh -c "curl https://asie.pl/files/czoo-syslibs-20220703.tar.gz | tar xzvf -"
      - name: Build
        run: ./build.sh .github/build-ci-windows.releases
      - name: Archive artifact
        uses: actions/upload-artifact@v3
        with:
          name: ClassicZoo (Windows)
          path: OUTPUT/zztwin64.zip

  build_linux:
    runs-on: ubuntu-22.04
    env:
      FPC_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Update Ubuntu packages
        run: sudo apt-get update
      - name: Set up Ubuntu packages
        run: sudo apt-get install -y fp-compiler-3.2.2 fp-units-base-3.2.2 fp-units-fcl-3.2.2 fp-units-net-3.2.2 fp-units-rtl-3.2.2 fp-utils-3.2.2 git zip libsdl2-dev
      - name: Build
        run: ./build.sh .github/build-ci-linux.releases
      - name: Archive artifact
        uses: actions/upload-artifact@v3
        with:
          name: ClassicZoo (Linux)
          path: OUTPUT/zztlin64.zip

  build_linux_aarch64:
    runs-on: ubuntu-22.04-arm
    env:
      FPC_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Update Ubuntu packages
        run: sudo apt-get update
      - name: Set up Ubuntu packages
        run: sudo apt-get install -y fp-compiler-3.2.2 fp-units-base-3.2.2 fp-units-fcl-3.2.2 fp-units-net-3.2.2 fp-units-rtl-3.2.2 fp-utils-3.2.2 git zip libsdl2-dev
      - name: Build
        run: ./build.sh .github/build-ci-linux-aarch64.releases
      - name: Archive artifact
        uses: actions/upload-artifact@v3
        with:
          name: ClassicZoo (Linux, AArch64)
          path: OUTPUT/zztlin64.zip

  build_macos:
    if: false
    runs-on: macos-latest
    env:
      FPC_PATH: /opt/homebrew
      HOME: /Users/runner
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Free Pascal and other dependencies
        run: brew install fpc bash coreutils gnu-sed dylibbundler && sed -i -e "s@/bin/bash@/opt/homebrew/bin/bash@g" build.sh make.sh
      - name: Install SDL2
        uses: BrettDong/setup-sdl2-frameworks@fc8da771a3356b25d56d06a81e274cd6eb75f28b
      - name: Build
        run: PATH="/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH" ./build.sh .github/build-ci-macos-aarch64.releases
      - name: Package (AArch64)
        run: cd OUTPUT && unzip zztmaca64.zip && cd .. && mkdir -p dist/ClassicZoo.app/Contents/MacOS && mkdir -p dist/ClassicZoo.app/Contents/libs/aarch64 && dylibbundler -od -b -x OUTPUT/ZZT -d dist/ClassicZoo.app/Contents/libs/aarch64/ -p @executable_path/../libs/aarch64/
      - name: Archive artifact
        uses: actions/upload-artifact@v3
        with:
          name: ClassicZoo (macOS, AArch64)
          path: |
            dist/ClassicZoo.app
